plugins { id 'com.android.application' }
android {
    namespace 'jp.nano.rawgallery.rawexperiment'
    compileSdk 35
    defaultConfig {
        applicationId 'jp.nano.rawgallery.rawexperiment'
        minSdk 30
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
        testInstrumentationRunner 'jp.nano.rawgallery.RawEditInstrumentation'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON' } }
    }
    ndkVersion '27.0.12077973'
    externalNativeBuild { cmake { path file('../app/src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
    sourceSets {
        main {
            java.srcDirs = [layout.buildDirectory.dir('generated/raw-editor/java')]
            assets.srcDir rootProject.file('third-party/libraw'); assets.srcDir rootProject.file('third-party/libjpeg-turbo')
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

// Give javac and lint the same bounded source tree; includes alone is ignored by lint.
def syncRawEditorSources = tasks.register('syncRawEditorSources', Sync) {
    from('../app/src/main/java') {
        include 'jp/nano/rawgallery/RawEdit*.java', 'jp/nano/rawgallery/NativeRaw.java', 'jp/nano/rawgallery/NativeJpeg.java'
    }
    into layout.buildDirectory.dir('generated/raw-editor/java')
}
tasks.named('preBuild').configure { dependsOn syncRawEditorSources }
tasks.configureEach { if (name.startsWith('lint') || name.contains('Lint')) dependsOn syncRawEditorSources }
