name: Verify and release Loupe
on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        sequence: [fresh, after-expressive, ordered, remaining]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install pinned Android build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
      - name: Create isolated verification signing key
        env:
          LOUPE_SIGNING_KEYSTORE: ${{ runner.temp }}/loupe-verification.keystore
        run: |
          echo "LOUPE_SIGNING_KEYSTORE=$LOUPE_SIGNING_KEYSTORE" >> "$GITHUB_ENV"
          keytool -genkeypair -keystore "$LOUPE_SIGNING_KEYSTORE" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 30 -dname 'CN=Loupe CI Verification'
      - name: Build isolated instrumentation candidates
        env:
          SEQUENCE: ${{ matrix.sequence }}
        run: |
          tasks=(:app:assembleDebug :app:assembleDebugAndroidTest)
          if [[ "$SEQUENCE" == remaining ]]; then
            tasks+=(:raw-experiment:assembleDebug :raw-experiment:assembleDebugAndroidTest)
          fi
          python3 scripts/ci_gradle.py "${tasks[@]}"
      - name: Observe system insets on a disposable emulator
        timeout-minutes: 30
        env:
          SEQUENCE: ${{ matrix.sequence }}
          LOUPE_INSTRUMENTATION_PORT: '5582'
        run: |
          sudo chmod a+rw /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'emulator' 'system-images;android-35;google_apis;x86_64'
          case "$SEQUENCE" in
            fresh)
              printf '%s\n' system-insets camera-pilot-usb-launch > tests/ci-android-modes.txt
              ;;
            after-expressive)
              printf '%s\n' expressive-ui system-insets camera-pilot-usb-launch > tests/ci-android-modes.txt
              ;;
            ordered)
              awk '$1 == "camera-pilot-usb-launch" { active = 1 } active { print } $1 == "system-insets" { found = 1; exit } END { if (!found) exit 1 }' tests/ci-android-modes.txt > "$RUNNER_TEMP/ordered"
              cat "$RUNNER_TEMP/ordered" > tests/ci-android-modes.txt
              LOUPE_DIAGNOSTIC_SKIP_RAW=true bash tests/ci-android-instrumentation.sh all
              exit
              ;;
            remaining)
              awk 'active { print } $1 == "system-insets" { active = 1 } END { if (!active) exit 1 }' tests/ci-android-modes.txt > "$RUNNER_TEMP/remaining"
              cat "$RUNNER_TEMP/remaining" > tests/ci-android-modes.txt
              bash tests/ci-android-instrumentation.sh all
              exit
              ;;
            *) exit 2 ;;
          esac
          bash tests/ci-android-instrumentation.sh before-camera
