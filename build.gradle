plugins {
    id 'com.android.application' version '8.10.1' apply false
    id 'org.jetbrains.kotlin.android' version '2.1.21' apply false
    id 'com.diffplug.spotless' version '8.12.0'
}

def existingTargetSdk = 35

subprojects {
    pluginManager.withPlugin('com.android.application') {
        android.lint {
            lintConfig = rootProject.file('lint.xml')
            baseline = file('lint-baseline.xml')
            warningsAsErrors = true
        }
        // The CI SDK is newer than the existing target. Show the notice only for
        // the recorded target, so changing targetSdk does not inherit the exception.
        androidComponents.finalizeDsl({ dsl ->
            if (dsl.defaultConfig.targetSdk == existingTargetSdk && dsl.productFlavors.isEmpty()) {
                dsl.lint.informational.add('OldTargetApi')
            }
        } as Action)
        androidComponents.onVariants(androidComponents.selector().all(), { variant ->
            def targetSdk = variant.targetSdk.apiLevel
            def lintTask = 'lint' + variant.name.capitalize()
            def label = "${project.path}:${variant.name}"
            tasks.matching { it.name == lintTask }.configureEach {
                doFirst {
                    if (targetSdk < existingTargetSdk) {
                        throw new GradleException(
                                "${label} targetSdk ${targetSdk} is below ${existingTargetSdk}")
                    }
                }
            }
        } as Action)
    }
}

def changedSourcesSince = { revision ->
    providers.exec {
        workingDir rootDir
        commandLine 'git', 'diff', '--name-only', '-z', '--diff-filter=ACMRT', revision,
                '--', 'app/src', 'raw-experiment/src', 'tests'
    }.standardOutput.asText.map { it.tokenize('\u0000') }
}

// The fixed base keeps committed changes in scope after main advances. The incoming
// base also detects a change that restores an already formatted file to its old bytes.
def formatBase = 'bd20e8a31c39849cd10e6aa73f70764866aa83c4'
def incomingBase = providers.gradleProperty('formatChangeBase').orElse('HEAD').flatMap { revision ->
    providers.exec {
        workingDir rootDir
        commandLine 'git', 'rev-parse', '--verify', '--end-of-options', "${revision}^{commit}"
    }.standardOutput.asText.map { it.trim() }
}
def changedSources = changedSourcesSince(formatBase).zip(incomingBase.flatMap(changedSourcesSince)) {
    baselinePaths, incomingPaths -> (baselinePaths + incomingPaths).unique()
}

spotless {
    lineEndings = com.diffplug.spotless.LineEnding.UNIX
    java {
        target changedSources.map { paths -> paths.findAll { it.endsWith('.java') } }
        googleJavaFormat('1.28.0')
    }
    kotlin {
        target changedSources.map { paths -> paths.findAll { it.endsWith('.kt') } }
        ktlint('1.8.0')
    }
}
