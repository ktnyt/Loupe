// JVM checks use ImageIO and HttpServer. Append the host system image after
// AGP's javac arguments; javac uses the last --system option.
afterEvaluate {
    tasks.withType(JavaCompile).configureEach {
        if (name.endsWith('UnitTestJavaWithJavac')) {
            def hostJdk = javaCompiler.get().metadata.installationPath.asFile.absolutePath
            options.compilerArgumentProviders.add({
                ['--system', hostJdk]
            } as CommandLineArgumentProvider)
        }
    }
