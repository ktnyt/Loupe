plugins { id 'com.android.application' }
android {
    namespace 'jp.nano.rawgallery'
    compileSdk 35
    ndkVersion '27.0.12077973'
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
    defaultConfig {
        applicationId 'jp.nano.rawgallery'
        // Keep the test APK identity stable across test modes and build variants.
        testApplicationId 'jp.nano.rawgallery.test'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON' } }
        minSdk 30
        targetSdk 35
        versionCode 139
        versionName '0.19.0'
        testInstrumentationRunner 'jp.nano.rawgallery.ArchiveInstrumentation'
    }
    sourceSets { main { assets.srcDir rootProject.file('third-party/libraw') } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'com.google.mediapipe:tasks-vision:0.10.35' }
