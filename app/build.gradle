plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
// The same source always has the same version; main merges advance one patch.
def distributionVersion = new groovy.json.JsonSlurper().parseText(providers.exec {
    workingDir rootProject.rootDir
    commandLine 'python3', rootProject.file('scripts/release-version.py').absolutePath,
            '--repo', rootProject.rootDir.absolutePath
}.standardOutput.asText.get())
android {
    namespace 'jp.nano.rawgallery'
    // CI binds the exact restored/test key instead of relying on Android's home lookup.
    def explicitSigningStore = System.getenv('LOUPE_SIGNING_KEYSTORE')
    if (explicitSigningStore) {
        if (!file(explicitSigningStore).isFile()) {
            throw new GradleException('Explicit Loupe signing keystore is missing')
        }
        signingConfigs.debug {
            storeFile file(explicitSigningStore)
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    def releaseSigning = [
        LOUPE_RELEASE_KEYSTORE: System.getenv('LOUPE_RELEASE_KEYSTORE'),
        LOUPE_RELEASE_STORE_PASSWORD: System.getenv('LOUPE_RELEASE_STORE_PASSWORD'),
        LOUPE_RELEASE_KEY_ALIAS: System.getenv('LOUPE_RELEASE_KEY_ALIAS'),
        LOUPE_RELEASE_KEY_PASSWORD: System.getenv('LOUPE_RELEASE_KEY_PASSWORD'),
    ]
    if (releaseSigning.values().any()) {
        def missing = releaseSigning.findAll { !it.value }.keySet()
        if (missing || !file(releaseSigning.LOUPE_RELEASE_KEYSTORE).isFile()) {
            throw new GradleException('Incomplete Loupe release signing configuration')
        }
        signingConfigs {
            release {
                storeFile file(releaseSigning.LOUPE_RELEASE_KEYSTORE)
                storePassword releaseSigning.LOUPE_RELEASE_STORE_PASSWORD
                keyAlias releaseSigning.LOUPE_RELEASE_KEY_ALIAS
                keyPassword releaseSigning.LOUPE_RELEASE_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        release {
            debuggable false
            minifyEnabled false
            shrinkResources false
            // Allow an unsigned local candidate. Publication must verify the expected signer.
            if (releaseSigning.LOUPE_RELEASE_KEYSTORE) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileSdk 35
    buildFeatures { buildConfig true }
    ndkVersion '27.0.12077973'
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
    defaultConfig {
        applicationId 'jp.nano.rawgallery'
        // Keep the test APK identity stable across test modes and build variants.
        testApplicationId 'jp.nano.rawgallery.test'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON' } }
        minSdk 30
        targetSdk 35
        versionCode distributionVersion.version_code
        versionName distributionVersion.version_name
        testInstrumentationRunner 'jp.nano.rawgallery.ArchiveInstrumentation'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'com.google.mediapipe:tasks-vision:0.10.35'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}

kotlin { jvmToolchain(17) }
dependencies { implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1' }

apply from: rootProject.file('gradle/native-licenses.gradle')
